<aside
    class="sidebar"
    data-class="navigation_bar"
    data-semantic="primary_navigation"
>

    <div class="sidebar-logo">

        <div class="sidebar-logo-icon">

            <span
                class="material-symbols-rounded"
                data-class="icon"
                data-semantic="application_logo_icon"
            >
                graphic_eq
            </span>

        </div>

        <span
            class="sidebar-logo-text"
            data-class="text"
            data-semantic="application_name"
        >
            Spotify
        </span>

    </div>


    <nav class="sidebar-navigation">

        {% for item in navigation["items"] %}

        <div
            class="
                sidebar-item

                {% if
                    navigation.selected
                    == item.semantic
                %}
                selected
                {% endif %}
            "
            data-class="navigation_item"
            data-semantic="{{ item.semantic }}"
        >

            <span
                class="material-symbols-rounded"
                data-class="icon"
                data-semantic="{{ item.semantic }}_icon"
            >
                {{ item.icon }}
            </span>

            <span
                class="sidebar-item-label"
                data-class="text"
                data-semantic="{{ item.semantic }}_label"
            >
                {{ item.name }}
            </span>

        </div>

        {% endfor %}

    </nav>


    <div class="sidebar-divider"></div>


    <div
        class="sidebar-library-title"
        data-class="text"
        data-semantic="library_heading"
    >
        Your Library
    </div>

</aside>
