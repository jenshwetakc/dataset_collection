<div class="grid2">{% for group in groups %}<article class="tile" data-class="card" data-semantic="group_{{ group['id'] }}"><img class="group-cover" src="{{ group['image'] }}" alt="{{ group['name'] }} cover" data-class="image" data-semantic="group_image_{{ group['id'] }}"><h3>{{ group['name'] }}</h3><p>{{ group['description'] }}</p><p class="muted">{{ group['members'] }} members · {{ group['photos'] }} photos</p><div class="actions">{{ btn('View group','chevron_right','group_view_'~group['id'],'outline') }}{{ btn('Join','add','group_join_'~group['id']) }}</div></article>{% endfor %}</div>
