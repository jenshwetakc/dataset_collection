{% for person in people %}<article class="person-row" data-class="card" data-semantic="person_{{ person['id'] }}">{{ avatar(person,'person_avatar_'~person['id']) }}<div class="grow"><h3>{{ person['name'] }}</h3><p>{{ person['bio'] }}</p><span class="muted">{{ person['followers'] }} followers</span></div>{{ btn('Follow',key='person_follow_'~person['id'],kind='outline') }}</article>{% endfor %}
