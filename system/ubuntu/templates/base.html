<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="
            width=device-width,
            initial-scale=1.0,
            maximum-scale=1.0,
            user-scalable=no
        "
    >

    <title>
        {% block title %}
        Ubuntu Synthetic UI
        {% endblock %}
    </title>


    <!-- =====================================================
         Material Symbols
         ===================================================== -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block"
        rel="stylesheet"
    >


    <style>

        /* ==================================================
           Theme
           ================================================== */

        :root {

            --primary:
                {{ theme.semantic.primary }};

            --on-primary:
                {{ theme.semantic.on_primary }};

            --primary-hover:
                {{ theme.semantic.primary_hover }};

            --primary-container:
                {{ theme.semantic.primary_container }};

            --on-primary-container:
                {{ theme.semantic.on_primary_container }};


            --background:
                {{ theme.semantic.background }};

            --on-background:
                {{ theme.semantic.on_background }};


            --surface:
                {{ theme.semantic.surface }};

            --on-surface:
                {{ theme.semantic.on_surface }};

            --surface-variant:
                {{ theme.semantic.surface_variant }};

            --on-surface-variant:
                {{ theme.semantic.on_surface_variant }};


            --text-primary:
                {{ theme.semantic.text_primary }};

            --text-secondary:
                {{ theme.semantic.text_secondary }};

            --text-disabled:
                {{ theme.semantic.text_disabled }};


            --icon:
                {{ theme.semantic.icon }};

            --icon-secondary:
                {{ theme.semantic.icon_secondary }};


            --border:
                {{ theme.semantic.border }};

            --border-subtle:
                {{ theme.semantic.border_subtle }};


            --success:
                {{ theme.semantic.success }};

            --warning:
                {{ theme.semantic.warning }};

            --error:
                {{ theme.semantic.error }};

            --info:
                {{ theme.semantic.info }};


            /* ==================================================
               Ubuntu Shell
               ================================================== */

            --panel-height:
                32px;

            --dock-width:
                68px;

            --dock-item-size:
                46px;

            --window-header-height:
                46px;

            --window-toolbar-height:
                48px;

            --window-radius:
                12px;

            --popup-radius:
                14px;

            --popup-width:
                360px;


            /* ==================================================
               Spacing
               ================================================== */

            --space-1:
                4px;

            --space-2:
                8px;

            --space-3:
                12px;

            --space-4:
                16px;

            --space-5:
                20px;

            --space-6:
                24px;

            --space-8:
                32px;


            /* ==================================================
               Shadows
               ================================================== */

            --window-shadow:
                0 14px 46px
                rgba(
                    0,
                    0,
                    0,
                    0.30
                );

            --popup-shadow:
                0 8px 28px
                rgba(
                    0,
                    0,
                    0,
                    0.28
                );
        }


        /* ==================================================
           Reset
           ================================================== */

        *,
        *::before,
        *::after {

            box-sizing:
                border-box;
        }


        html,
        body {

            width:
                100%;

            height:
                100%;

            margin:
                0;

            padding:
                0;

            overflow:
                hidden;
        }


        html {

            font-family:
                Ubuntu,
                Arial,
                Helvetica,
                sans-serif;

            background:
                var(--background);

            color:
                var(--text-primary);
        }


        body {

            user-select:
                none;
        }


        button,
        input,
        textarea {

            font:
                inherit;
        }


        button {

            padding:
                0;

            margin:
                0;

            border:
                none;

            background:
                transparent;

            color:
                inherit;

            cursor:
                default;
        }


        input {

            border:
                none;

            outline:
                none;

            background:
                transparent;

            color:
                inherit;
        }


        img {

            display:
                block;

            object-fit:
                cover;
        }


        h1,
        h2,
        h3,
        p {

            margin:
                0;
        }


        /* ==================================================
           Material Symbols
           ================================================== */

        .material-symbols-rounded {

            font-family:
                "Material Symbols Rounded";

            font-weight:
                normal;

            font-style:
                normal;

            font-size:
                22px;

            line-height:
                1;

            letter-spacing:
                normal;

            text-transform:
                none;

            display:
                inline-block;

            white-space:
                nowrap;

            font-feature-settings:
                "liga";

            -webkit-font-feature-settings:
                "liga";

            -webkit-font-smoothing:
                antialiased;

            user-select:
                none;

            vertical-align:
                middle;
        }


        /* ==================================================
           Root
           ================================================== */

        #app {

            position:
                relative;

            width:
                100vw;

            height:
                100vh;

            overflow:
                hidden;

            background:
                var(--background);
        }


        .ubuntu-page-root {

            position:
                relative;

            width:
                100%;

            height:
                100%;

            overflow:
                hidden;
        }


        /* ==================================================
           Generic Ubuntu Components
           ================================================== */

        .ubuntu-icon-button {

            display:
                inline-flex;

            align-items:
                center;

            justify-content:
                center;

            width:
                34px;

            height:
                34px;

            border-radius:
                8px;

            color:
                var(--icon);
        }


        .ubuntu-icon-button:hover {

            background:
                var(--surface-variant);
        }


        .ubuntu-button {

            display:
                inline-flex;

            align-items:
                center;

            justify-content:
                center;

            min-height:
                38px;

            padding:
                0 16px;

            border-radius:
                8px;

            background:
                var(--surface-variant);

            color:
                var(--on-surface-variant);

            font-weight:
                600;
        }


        .ubuntu-primary-button {

            background:
                var(--primary);

            color:
                var(--on-primary);
        }


        .ubuntu-card {

            background:
                var(--surface);

            color:
                var(--on-surface);

            border:
                1px solid
                var(--border-subtle);

            border-radius:
                var(--popup-radius);
        }


        .truncate {

            overflow:
                hidden;

            white-space:
                nowrap;

            text-overflow:
                ellipsis;
        }


        [hidden] {

            display:
                none !important;
        }

    </style>


    {% block head %}
    {% endblock %}

</head>


<body>

    <div id="app">

        <main class="ubuntu-page-root">

            {% block content %}
            {% endblock %}

        </main>

    </div>

</body>

</html>
