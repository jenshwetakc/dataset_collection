<div class="game-grid">{% for item in items %}<article class="game-card" data-class="card" data-semantic="item_{{ item['id'] }}"><img src="{{ item['image'] }}" alt="{{ item['name'] }}" data-class="image" data-semantic="item_image_{{ item['id'] }}"><h3>{{ item['name'] }}</h3><p class="muted">By {{ item['creator'] }}</p><div class="item-price">{{ icon('robux','item_currency_'~item['id']) }}{{ item['price'] }}</div><div class="actions">{{ btn('View',key='item_view_'~item['id'],kind='outline') }}{{ ib('more_horiz','item_options_'~item['id']) }}</div></article>{% endfor %}</div>
