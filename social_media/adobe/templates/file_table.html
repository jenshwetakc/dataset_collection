<div class="table-wrap" data-class="section" data-semantic="file_table">
    <table>
        <thead>
        <tr>
            <th>File name</th>
            <th>Modified</th>
            <th>Owner</th>
            <th>Size</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>{% for file in files %}
        <tr>
            <td>
                <div class="row"><img class="file-thumb" src="{{ file['image'] }}" alt="File preview" data-class="image"
                                      data-semantic="file_preview_{{ file['id'] }}"><strong>{{ file['name'] }}</strong>
                </div>
            </td>
            <td>{{ file['modified'] }}</td>
            <td>{{ file['owner'] }}</td>
            <td>{{ file['size'] }}</td>
            <td>
                <div class="row">{{ ib('share','file_share_'~file['id']) }}{{
                    ib('more_horiz','file_options_'~file['id']) }}
                </div>
            </td>
        </tr>
        {% endfor %}
        </tbody>
    </table>
</div>
