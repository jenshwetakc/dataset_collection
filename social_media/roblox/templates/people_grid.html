<div class="people-grid">{% for person in people %}<article class="person-tile" data-class="card" data-semantic="person_{{ person['id'] }}"><img src="{{ person['image'] }}" alt="{{ person['name'] }} avatar" data-class="avatar" data-semantic="person_avatar_{{ person['id'] }}"><h3>{{ person['name'] }}</h3><p class="muted">{{ person['status'] }}</p><div class="actions">{{ btn('Accept' if app_data['state']=='requests' else 'Connect',key='person_connect_'~person['id'],kind='outline') }}{{ ib('more_horiz','person_options_'~person['id']) }}</div></article>{% endfor %}</div>
