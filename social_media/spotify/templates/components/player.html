<section
    class="playback-player"
    data-class="media_item"
    data-semantic="playback_player"
    data-occluder="true"
>

    <!-- ==================================================
         Current Track
         ================================================== -->

    <div class="player-track">

        {% if player.track.image %}

        <img
            class="player-image"
            src="{{ player.track.image }}"
            data-class="image"
            data-semantic="currently_playing_artwork"
            alt=""
        >

        {% else %}

        <div
            class="player-image"
            data-class="image"
            data-semantic="currently_playing_artwork"
        ></div>

        {% endif %}


        <div class="player-track-info">

            <div
                class="player-track-title"
                data-class="text"
                data-semantic="currently_playing_title"
            >
                {{ player.track.title }}
            </div>

            <div
                class="player-track-artist"
                data-class="text"
                data-semantic="currently_playing_artist"
            >
                {{ player.track.artist }}
            </div>

        </div>


        <button
            class="player-control"
            data-class="button"
            data-semantic="like_current_track"
        >

            <span
                class="material-symbols-rounded"
                data-class="icon"
                data-semantic="favorite_icon"
            >
                {% if player.track.liked %}
                favorite
                {% else %}
                favorite_border
                {% endif %}
            </span>

        </button>


        <button
            class="
                player-control
                mobile-player-action
            "
            style="display:none;"
            data-class="button"
            data-semantic="mobile_playback_toggle"
        >

            <span
                class="material-symbols-rounded"
                data-class="icon"
                data-semantic="mobile_playback_toggle_icon"
            >
                {% if player.playing %}
                pause
                {% else %}
                play_arrow
                {% endif %}
            </span>

        </button>

    </div>


    <!-- ==================================================
         Desktop Controls
         ================================================== -->

    <div class="player-center">

        <div class="player-controls">

            <button
                class="
                    player-control
                    {% if player.shuffle %}
                    active
                    {% endif %}
                "
                data-class="button"
                data-semantic="shuffle"
            >

                <span
                    class="material-symbols-rounded"
                    data-class="icon"
                    data-semantic="shuffle_icon"
                >
                    shuffle
                </span>

            </button>


            <button
                class="player-control"
                data-class="button"
                data-semantic="previous_track"
            >

                <span
                    class="material-symbols-rounded"
                    data-class="icon"
                    data-semantic="previous_track_icon"
                >
                    skip_previous
                </span>

            </button>


            <button
                class="main-play-button"
                data-class="button"
                data-semantic="playback_toggle"
            >

                <span
                    class="material-symbols-rounded"
                    data-class="icon"
                    data-semantic="playback_toggle_icon"
                >
                    {% if player.playing %}
                    pause
                    {% else %}
                    play_arrow
                    {% endif %}
                </span>

            </button>


            <button
                class="player-control"
                data-class="button"
                data-semantic="next_track"
            >

                <span
                    class="material-symbols-rounded"
                    data-class="icon"
                    data-semantic="next_track_icon"
                >
                    skip_next
                </span>

            </button>


            <button
                class="
                    player-control
                    {% if player.repeat %}
                    active
                    {% endif %}
                "
                data-class="button"
                data-semantic="repeat"
            >

                <span
                    class="material-symbols-rounded"
                    data-class="icon"
                    data-semantic="repeat_icon"
                >
                    repeat
                </span>

            </button>

        </div>


        <div class="player-progress-row">

            <span
                class="player-time"
                data-class="timestamp"
                data-semantic="elapsed_time"
            >
                {{ player.elapsed }}
            </span>

            <div
                class="player-progress"
                data-class="progress_bar"
                data-semantic="track_progress"
            >

                <div
                    class="player-progress-value"
                    style="
                        width:
                            {{ player.progress * 100 }}%;
                    "
                ></div>

            </div>

            <span
                class="player-time"
                data-class="timestamp"
                data-semantic="track_duration"
            >
                {{ player.track.duration }}
            </span>

        </div>

    </div>


    <!-- ==================================================
         Right Controls
         ================================================== -->

    <div class="player-right">

        <button
            class="player-control"
            data-class="button"
            data-semantic="queue"
        >
            <span
                class="material-symbols-rounded"
                data-class="icon"
                data-semantic="queue_icon"
            >
                queue_music
            </span>
        </button>


        <button
            class="player-control"
            data-class="button"
            data-semantic="devices"
        >
            <span
                class="material-symbols-rounded"
                data-class="icon"
                data-semantic="devices_icon"
            >
                devices
            </span>
        </button>


        <button
            class="player-control"
            data-class="button"
            data-semantic="volume"
        >
            <span
                class="material-symbols-rounded"
                data-class="icon"
                data-semantic="volume_icon"
            >
                volume_up
            </span>
        </button>


        <div
            class="volume-progress"
            data-class="progress_bar"
            data-semantic="volume_level"
        >

            <div
                class="volume-progress-value"
                style="
                    width:
                        {{ player.volume * 100 }}%;
                "
            ></div>

        </div>

    </div>

</section>
