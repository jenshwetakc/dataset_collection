{% for s in tiktok['sounds'] %}
<div class="row card pad" data-class="section">{{btn('play_arrow','sound_play_' ~ loop.index,annotate=false)}}<img
        style="width:48px;height:48px" src="{{s['image']}}" alt="Sound artwork" data-class="image"
        data-semantic="sound_art_'{{loop.index}}">
    <div class="grow"><strong>{{s['title']}}</strong>
        <p class="muted">{{s['artist']}} · {{s['duration']}} · {{s['uses']}} videos</p></div>
    {{btn('bookmark','sound_save_' ~ loop.index,annotate=false)}}
</div>{% endfor %}
