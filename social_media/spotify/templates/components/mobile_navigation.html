<nav
    class="mobile-navigation"
    data-class="navigation_bar"
    data-semantic="mobile_navigation"
    data-occluder="true"
>

    {% for item in navigation["items"] %}

    <div
        class="
            mobile-nav-item

            {% if
                navigation.selected
                == item.semantic
            %}
            selected
            {% endif %}
        "
        data-class="navigation_item"
        data-semantic="{{ item.semantic }}"
    >

        <span
            class="material-symbols-rounded"
            data-class="icon"
            data-semantic="{{ item.semantic }}_icon"
        >
            {{ item.icon }}
        </span>

        <span
            class="mobile-nav-label"
            data-class="text"
            data-semantic="{{ item.semantic }}_label"
        >
            {{ item.name }}
        </span>

    </div>

    {% endfor %}

</nav>
