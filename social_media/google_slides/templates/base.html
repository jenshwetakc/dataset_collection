<!DOCTYPE html>
<html
    lang="en"
    data-theme="{{ theme['mode'] }}"
>
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        {{ page_data.get('app_name', 'Synthetic UI') }}
    </title>

    <!-- Material Design icons -->
    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block"
        rel="stylesheet"
    >

    <style>
        :root {
            --theme-primary:
                {{ theme['semantic']['primary'] }};

            --theme-primary-hover:
                {{ theme['semantic']['primary_hover'] }};

            --theme-on-primary:
                {{ theme['semantic']['on_primary'] }};

            --theme-primary-container:
                {{ theme['semantic']['primary_container'] }};

            --theme-on-primary-container:
                {{ theme['semantic']['on_primary_container'] }};

            --theme-background:
                {{ theme['semantic']['background'] }};

            --theme-on-background:
                {{ theme['semantic']['on_background'] }};

            --theme-surface:
                {{ theme['semantic']['surface'] }};

            --theme-on-surface:
                {{ theme['semantic']['on_surface'] }};

            --theme-surface-variant:
                {{ theme['semantic']['surface_variant'] }};

            --theme-on-surface-variant:
                {{ theme['semantic']['on_surface_variant'] }};

            --theme-text-primary:
                {{ theme['semantic']['text_primary'] }};

            --theme-text-secondary:
                {{ theme['semantic']['text_secondary'] }};

            --theme-text-disabled:
                {{ theme['semantic']['text_disabled'] }};

            --theme-icon:
                {{ theme['semantic']['icon'] }};

            --theme-icon-secondary:
                {{ theme['semantic']['icon_secondary'] }};

            --theme-border:
                {{ theme['semantic']['border'] }};

            --theme-border-subtle:
                {{ theme['semantic']['border_subtle'] }};

            --theme-success:
                {{ theme['semantic']['success'] }};

            --theme-on-success:
                {{ theme['semantic']['on_success'] }};

            --theme-error:
                {{ theme['semantic']['error'] }};

            --theme-on-error:
                {{ theme['semantic']['on_error'] }};

            --theme-info:
                {{ theme['semantic']['info'] }};

            --theme-on-info:
                {{ theme['semantic']['on_info'] }};

            --theme-badge-background:
                {{ theme['semantic']['badge_background'] }};

            --theme-badge-text:
                {{ theme['semantic']['badge_text'] }};
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
            margin: 0;
            padding: 0;
        }

        body {
            color: var(--theme-text-primary);
            background: var(--theme-background);
            font-family:
                Arial,
                Helvetica,
                sans-serif;
            -webkit-font-smoothing: antialiased;
            text-rendering: optimizeLegibility;
        }

        button,
        input,
        textarea,
        select {
            color: inherit;
            font: inherit;
        }

        button {
            border: 0;
            cursor: pointer;
        }

        button:disabled,
        input:disabled,
        textarea:disabled,
        select:disabled {
            cursor: not-allowed;
            opacity: 0.58;
        }

        .material-symbols-rounded {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex: 0 0 auto;
            width: 1em;
            height: 1em;
            color: var(--theme-icon);
            font-family: "Material Symbols Rounded";
            font-size: 20px;
            font-style: normal;
            font-weight: normal;
            line-height: 1;
            letter-spacing: normal;
            text-transform: none;
            white-space: nowrap;
            word-wrap: normal;
            direction: ltr;
            vertical-align: middle;
            -webkit-font-feature-settings: "liga";
            -webkit-font-smoothing: antialiased;
            font-feature-settings: "liga";
            font-variation-settings:
                "FILL" 0,
                "wght" 500,
                "GRAD" 0,
                "opsz" 24;
        }

        .material-symbols-rounded.is-filled {
            font-variation-settings:
                "FILL" 1,
                "wght" 500,
                "GRAD" 0,
                "opsz" 24;
        }

        .material-symbols-rounded.icon-secondary {
            color: var(--theme-icon-secondary);
        }

        .material-symbols-rounded.icon-small {
            font-size: 16px;
        }

        .material-symbols-rounded.icon-large {
            font-size: 24px;
        }
    </style>

    {% block head %}
    {% endblock %}
</head>

<body>
    {% block content %}
    {% endblock %}
</body>
</html>
