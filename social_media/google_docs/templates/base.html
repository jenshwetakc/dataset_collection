<!DOCTYPE html>

<html
    lang="en"
    data-theme="{{ theme.mode | default('light') }}"
>

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="
            width=device-width,
            initial-scale=1.0,
            maximum-scale=1.0,
            user-scalable=no
        "
    >

    <title>
        {% block title %}
        Synthetic Google Workspace UI
        {% endblock %}
    </title>

    <!-- Material Symbols Rounded -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block"
        rel="stylesheet"
    >

    <style>

        :root {

            color-scheme:
                light;

            --primary:
                {{ theme.semantic.primary }};

            --on-primary:
                {{ theme.semantic.on_primary }};

            --primary-container:
                {{ theme.semantic.primary_container }};

            --on-primary-container:
                {{ theme.semantic.on_primary_container }};

            --background:
                {{ theme.semantic.background }};

            --on-background:
                {{ theme.semantic.on_background }};

            --surface:
                {{ theme.semantic.surface }};

            --on-surface:
                {{ theme.semantic.on_surface }};

            --surface-variant:
                {{ theme.semantic.surface_variant }};

            --on-surface-variant:
                {{ theme.semantic.on_surface_variant }};

            --text-primary:
                {{ theme.semantic.text_primary }};

            --text-secondary:
                {{ theme.semantic.text_secondary }};

            --text-disabled:
                {{ theme.semantic.text_disabled }};

            --icon:
                {{ theme.semantic.icon }};

            --icon-secondary:
                {{ theme.semantic.icon_secondary }};

            --border:
                {{ theme.semantic.border }};

            --border-subtle:
                {{ theme.semantic.border_subtle }};

            --badge-background:
                {{ theme.semantic.badge_background }};

            --badge-text:
                {{ theme.semantic.badge_text }};

            --success:
                {{ theme.semantic.success }};

            --on-success:
                {{ theme.semantic.on_success }};

            --warning:
                {{ theme.semantic.warning }};

            --on-warning:
                {{ theme.semantic.on_warning }};

            --error:
                {{ theme.semantic.error }};

            --on-error:
                {{ theme.semantic.on_error }};

            --info:
                {{ theme.semantic.info }};

            --on-info:
                {{ theme.semantic.on_info }};

            --page-padding:
                24px;

            --small-gap:
                8px;

            --content-gap:
                16px;

            --section-gap:
                28px;

            --control-small:
                32px;

            --control-medium:
                40px;

            --control-large:
                48px;

            --small-radius:
                6px;

            --medium-radius:
                10px;

            --large-radius:
                18px;

            --pill-radius:
                999px;
        }

        html[data-theme="dark"] {

            color-scheme:
                dark;
        }

        *,
        *::before,
        *::after {

            box-sizing:
                border-box;
        }

        html,
        body {

            width:
                100%;

            min-height:
                100%;

            margin:
                0;

            padding:
                0;

            background:
                var(--background);

            color:
                var(--on-background);

            font-family:
                Arial,
                Helvetica,
                sans-serif;
        }

        html {

            scroll-behavior:
                auto;
        }

        body {

            overflow-x:
                hidden;

            user-select:
                none;
        }

        button,
        input,
        textarea,
        select {

            font:
                inherit;
        }

        button {

            margin:
                0;

            border:
                none;

            padding:
                0;

            background:
                transparent;

            color:
                inherit;

            cursor:
                default;
        }

        input,
        textarea {

            border:
                none;

            outline:
                none;

            background:
                transparent;

            color:
                inherit;
        }

        img {

            display:
                block;

            max-width:
                100%;

            object-fit:
                cover;
        }

        h1,
        h2,
        h3,
        h4,
        p {

            margin:
                0;
        }

        ul,
        ol {

            margin:
                0;

            padding:
                0;

            list-style:
                none;
        }

        /* Material Symbols Rounded */

        .material-symbols-rounded {

            display:
                inline-block;

            font-family:
                "Material Symbols Rounded";

            font-size:
                24px;

            font-weight:
                normal;

            font-style:
                normal;

            line-height:
                1;

            white-space:
                nowrap;

            font-feature-settings:
                "liga";

            -webkit-font-feature-settings:
                "liga";

            -webkit-font-smoothing:
                antialiased;

            -moz-osx-font-smoothing:
                grayscale;
        }

        /* Shared icon control */

        .icon-button {

            display:
                inline-flex;

            align-items:
                center;

            justify-content:
                center;

            width:
                var(--control-medium);

            height:
                var(--control-medium);

            flex:
                0 0 auto;

            border-radius:
                var(--pill-radius);

            color:
                var(--icon);
        }

        .truncate {

            overflow:
                hidden;

            white-space:
                nowrap;

            text-overflow:
                ellipsis;
        }

        @media (max-width: 599px) {

            :root {

                --page-padding:
                    12px;

                --content-gap:
                    10px;

                --section-gap:
                    22px;
            }
        }

        @media (max-width: 359px) {

            :root {

                --page-padding:
                    10px;

                --content-gap:
                    8px;
            }
        }

        @media (min-width: 840px) {

            :root {

                --page-padding:
                    28px;

                --content-gap:
                    18px;
            }
        }

        @media (min-width: 1920px) {

            :root {

                --page-padding:
                    36px;
            }
        }

    </style>

    {% block head %}
    {% endblock %}

</head>

<body
    data-theme="{{ theme.mode | default('light') }}"
>

    {% block content %}
    {% endblock %}

</body>

</html>
