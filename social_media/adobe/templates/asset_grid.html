<div class="asset-grid">{% for asset in assets %}<article class="asset-card" data-class="card" data-semantic="asset_{{ asset['id'] }}"><img src="{{ asset['image'] }}" alt="{{ asset['title'] }} illustration" data-class="image" data-semantic="asset_image_{{ asset['id'] }}"><div class="asset-copy"><div class="row between"><h3>{{ asset['title'] }}</h3>{{ ib('more_horiz','asset_options_'~asset['id']) }}</div><p class="muted">{{ asset['type'] }} · {{ asset['author']['name'] }}</p><div class="actions">{{ btn('Preview',key='asset_preview_'~asset['id'],kind='outline') }}{{ ib('bookmark_border','asset_save_'~asset['id']) }}</div></div></article>{% endfor %}</div>
