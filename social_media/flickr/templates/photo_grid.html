<div class="photo-grid {{ grid_class|default('') }}">{% for photo in photos %}<article class="photo-card" data-class="card" data-semantic="photo_{{ photo['id'] }}"><img src="{{ photo['image'] }}" alt="{{ photo['title'] }}" data-class="image" data-semantic="photo_image_{{ photo['id'] }}"><div class="photo-info"><div><h3>{{ photo['title'] }}</h3><p>{{ photo['author']['name'] }}</p></div><div class="actions">{{ ib('star','photo_fave_'~photo['id']) }}{{ ib('chat','photo_comments_'~photo['id']) }}</div></div></article>{% endfor %}</div>
