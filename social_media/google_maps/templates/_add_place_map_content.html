{% if add_place.map.water %}

<div
    class="map-water"
    style="
        left:
            {{ add_place.map.water.x }}%;

        top:
            {{ add_place.map.water.y }}%;

        width:
            {{ add_place.map.water.width }}%;

        height:
            {{ add_place.map.water.height }}%;

        transform:
            rotate(
                {{ add_place.map.water.rotation }}deg
            );
    "
></div>

{% endif %}


{% for park in add_place.map.parks %}

<div
    class="map-park"
    style="
        left:
            {{ park.x }}%;

        top:
            {{ park.y }}%;

        width:
            {{ park.width }}%;

        height:
            {{ park.height }}%;

        border-radius:
            {{ park.radius }}%;
    "
></div>

{% endfor %}


{% for building in add_place.map.buildings %}

<div
    class="map-building"
    style="
        left:
            {{ building.x }}%;

        top:
            {{ building.y }}%;

        width:
            {{ building.width }}%;

        height:
            {{ building.height }}%;

        transform:
            rotate(
                {{ building.rotation }}deg
            );
    "
></div>

{% endfor %}


{% for road in add_place.map.roads %}

<div
    class="map-road"
    style="
        left:
            {{ road.x }}%;

        top:
            {{ road.y }}%;

        width:
            {{ road.length }}%;

        height:
            {{ road.width }}px;

        transform:
            rotate(
                {{ road.angle }}deg
            );
    "
></div>

{% endfor %}


{% for label in add_place.map.labels %}

<span
    class="map-label"
    style="
        left:
            {{ label.x }}%;

        top:
            {{ label.y }}%;

        transform:
            rotate(
                {{ label.rotation }}deg
            );
    "
>
    {{ label.text }}
</span>

{% endfor %}


<!-- Main Selected Location -->

<div
    class="location-marker"
    style="
        left:
            {{ add_place.map.selected_location.x }}%;

        top:
            {{ add_place.map.selected_location.y }}%;
    "
    data-class="selection_indicator"
    data-semantic="selected_place_location"
>

    <span
        class="material-symbols-rounded"
        data-class="icon"
        data-semantic="selected_place_location_icon"
    >
        location_on
    </span>

</div>


<button
    class="map-location-button"
    data-class="button"
    data-semantic="recenter_place_location"
>

    <span
        class="material-symbols-rounded"
        data-class="icon"
        data-semantic="recenter_place_location_icon"
    >
        my_location
    </span>

</button>
