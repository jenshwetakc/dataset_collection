<div class="game-grid">{% for game in games %}<article class="game-card" data-class="card" data-semantic="game_{{ game['id'] }}"><img src="{{ game['image'] }}" alt="{{ game['title'] }} artwork" data-class="image" data-semantic="game_image_{{ game['id'] }}"><h3>{{ game['title'] }}</h3><div class="game-meta"><span>{{ game['rating'] }}% positive</span><span>{{ game['players'] }} active</span></div><p class="muted">By {{ game['creator'] }}</p><div class="actions">{{ btn('Play','play','game_play_'~game['id'],'filled') }}{{ ib('more_horiz','game_options_'~game['id']) }}</div></article>{% endfor %}</div>
