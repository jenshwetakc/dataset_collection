<div class="album-grid">{% for album in albums %}<article class="album-card" data-class="card" data-semantic="album_{{ album['id'] }}"><img src="{{ album['image'] }}" alt="{{ album['title'] }} cover" data-class="image" data-semantic="album_image_{{ album['id'] }}"><div class="album-copy"><h3>{{ album['title'] }}</h3><p>{{ album['count'] }} photos · {{ app_data['profile']['name'] }}</p><div class="actions">{{ btn('View album','chevron_right','album_open_'~album['id']) }}{{ ib('more_horiz','album_options_'~album['id']) }}</div></div></article>{% endfor %}</div>
