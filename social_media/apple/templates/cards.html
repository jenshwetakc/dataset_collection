<div class="grid">{% for p in products %}
    <article class="card" data-class="card" data-semantic="product_{{ p['id'] }}" >{{
        badge('Explore','product_badge_'~p['id']) }}<h3>{{ p['name'] }}</h3>
        <p>{{ p['caption'] }}</p><img src="{{ p['image'] }}" alt="Illustrative {{ p['name'] }}" data-class="image"
                                      data-semantic="product_image_{{ p['id'] }}">
        <p>From ${{ p['price'] }} · Illustrative price</p>
        <div class="actions">{{ btn('Learn more','chevron_right','product_learn_'~p['id']) }}{{
            btn('Buy',key='product_buy_'~p['id'],kind='filled') }}
        </div>
    </article>
    {% endfor %}
</div>
