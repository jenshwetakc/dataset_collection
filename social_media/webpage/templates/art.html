{% from 'components.html' import icon %}
{% macro art(page,key) %}<div class="art" data-class="image" data-semantic="{{ key }}" aria-label="Illustrative {{ page|replace('_',' ') }} graphic"><svg viewBox="0 0 560 480" role="img" aria-label="{{ page|replace('_',' ') }} illustration"><defs><linearGradient id="gradient_{{ key }}"><stop stop-color="var(--primary)"/><stop offset="1" stop-color="var(--surface)"/></linearGradient></defs>
{% if page=='legal' %}<rect x="75" y="40" width="380" height="390" rx="38" fill="var(--surface)" opacity=".18"/>{% for i in range(9) %}<rect x="{{ 95+i*37 }}" y="280" width="25" height="125" rx="4" fill="var(--primary)" opacity="{{ 0.3+i*0.05 }}"/>{% endfor %}<path d="M275 90 V340 M175 160 H375 M195 160 L150 245 H240Z M355 160 L310 245 H400Z M240 350 H310" fill="none" stroke="currentColor" stroke-width="10"/><circle cx="275" cy="80" r="18" fill="currentColor"/>
{% elif page=='charity' %}<path d="M60 90 Q160 0 230 70 Q390 10 495 140 L440 390 Q210 480 55 340Z" fill="#f2c34c" opacity=".65"/>{% for x,y,h in [(140,125,130),(270,90,150),(380,155,110)] %}<circle cx="{{ x }}" cy="{{ y }}" r="35" fill="var(--primary)"/><path d="M{{ x-45 }} {{ y+55 }} Q{{ x }} {{ y+20 }} {{ x+45 }} {{ y+55 }} V{{ y+h }} H{{ x-45 }}Z" fill="var(--primary)" opacity=".55"/>{% endfor %}<path d="M125 350 Q250 285 405 350" fill="none" stroke="currentColor" stroke-width="10"/>
{% elif page=='real_estate' %}<path d="M30 390 H535" stroke="currentColor" opacity=".3"/><rect x="70" y="160" width="410" height="220" rx="6" fill="var(--surface)"/><rect x="210" y="95" width="275" height="80" fill="var(--primary)"/><rect x="85" y="185" width="195" height="105" fill="#5399ae"/>{% for x in [305,350,395,440] %}<rect x="{{ x }}" y="195" width="30" height="155" fill="#32606b"/>{% endfor %}<rect x="95" y="310" width="170" height="45" fill="#7ab7c6"/><path d="M65 385 L495 385 L540 435 L10 435Z" fill="#52a6b8"/><path d="M35 140 L20 365 M35 140 L10 210 M35 140 L65 190" fill="none" stroke="var(--primary)" stroke-width="12"/>
{% elif page=='fitness' %}<circle cx="290" cy="85" r="38" fill="currentColor"/><path d="M245 137 Q285 110 325 137 L355 270 H218Z" fill="var(--primary)"/><path d="M247 160 L165 245 M323 160 L405 245 M250 266 L210 420 M320 266 L370 420" stroke="currentColor" stroke-width="30" stroke-linecap="round"/><path d="M110 245 H450" stroke="currentColor" stroke-width="12"/>{% for x in [105,130,420,445] %}<rect x="{{ x }}" y="210" width="17" height="70" rx="4" fill="currentColor"/>{% endfor %}
{% elif page=='pool_services' %}<path d="M40 230 L450 185 L525 380 L115 425Z" fill="#137cac"/><path d="M60 242 L438 206 L496 368 L129 398Z" fill="#47c7e5"/>{% for y in [270,315,360] %}<path d="M120 {{ y }} Q210 {{ y-22 }} 310 {{ y }} T440 {{ y }}" stroke="#d8f8ff" fill="none" stroke-width="4"/>{% endfor %}<path d="M370 75 V265 M395 75 V265 M370 85 H395 M370 125 H395 M370 165 H395 M370 205 H395" stroke="currentColor" fill="none" stroke-width="9"/><circle cx="140" cy="105" r="40" fill="#d7f4fa" opacity=".65"/>
{% elif page=='enterprise_ai' %}<circle cx="285" cy="235" r="160" stroke="currentColor" stroke-width="2" fill="none" opacity=".25"/><circle cx="285" cy="235" r="110" fill="url(#gradient_{{ key }})"/><path d="M215 210 H355 M225 265 H345 M285 155 V325" stroke="currentColor" stroke-width="8"/>{% for x,y in [(95,90),(465,105),(90,365),(460,390),(280,40)] %}<path d="M285 235 L{{ x }} {{ y }}" stroke="currentColor" opacity=".4"/><circle cx="{{ x }}" cy="{{ y }}" r="18" fill="var(--primary)"/>{% endfor %}
{% elif page=='travel' %}<circle cx="420" cy="95" r="42" fill="#eaca75"/><path d="M0 295 L150 70 L270 270 L355 150 L560 295Z" fill="#174d55"/><path d="M95 152 L150 70 L198 151 L160 140 L143 159Z" fill="#f6f9f7"/><path d="M0 295 H560 V480 H0Z" fill="#308ca1"/>{% for y in [330,375,420] %}<path d="M30 {{ y }} Q150 {{ y-20 }} 280 {{ y }} T540 {{ y }}" fill="none" stroke="#b9dfdb" stroke-width="3"/><path d="M460 260 L480 425 M460 260 Q400 210 395 285 M460 260 Q515 215 535 265 M460 260 Q490 190 460 175" fill="none" stroke="#255e44" stroke-width="12"/>{% endfor %}
{% elif page=='fintech' %}{% for x,y,rot in [(125,90,-12),(255,65,5),(350,125,14)] %}<g transform="rotate({{ rot }} {{ x+70 }} {{ y+130 }})"><rect x="{{ x }}" y="{{ y }}" width="145" height="280" rx="22" fill="#1b2029"/><rect x="{{ x+7 }}" y="{{ y+10 }}" width="131" height="259" rx="16" fill="#fff"/><rect x="{{ x+20 }}" y="{{ y+56 }}" width="105" height="62" rx="9" fill="var(--primary)"/><text x="{{ x+30 }}" y="{{ y+87 }}" fill="var(--on-primary)" font-size="16">$12,480</text><polyline points="{{ x+20 }},{{ y+190 }} {{ x+46 }},{{ y+170 }} {{ x+65 }},{{ y+180 }} {{ x+94 }},{{ y+145 }} {{ x+122 }},{{ y+153 }}" stroke="var(--primary)" fill="none" stroke-width="3"/>{% for k in range(3) %}<rect x="{{ x+22 }}" y="{{ y+209+k*15 }}" width="95" height="5" rx="2" fill="#d8dbe3"/>{% endfor %}</g>{% endfor %}
{% elif page=='solar' %}<circle cx="425" cy="85" r="42" fill="#efcf6d"/>{% for k in range(3) %}<path d="M{{ 65+k*145 }} 240 L{{ 180+k*145 }} 240 L{{ 200+k*145 }} 355 L{{ 45+k*145 }} 355Z" fill="#266893" stroke="#abcddb" stroke-width="3"/>{% for y in [268,296,324] %}<path d="M{{ 60+k*145 }} {{ y }} H{{ 187+k*145 }}" stroke="#abcddb"/>{% endfor %}<path d="M{{ 110+k*145 }} 240 V355" stroke="#abcddb"/><path d="M{{ 90+k*145 }} 355 V405 M{{ 158+k*145 }} 355 V405" stroke="currentColor" stroke-width="5"/>{% endfor %}
{% else %}<circle cx="290" cy="105" r="43" fill="var(--primary)"/><path d="M225 170 Q290 140 355 170 L390 390 H190Z" fill="var(--surface)" stroke="var(--primary)" stroke-width="4"/><path d="M260 175 V235 Q290 300 320 235 V175" fill="none" stroke="var(--primary)" stroke-width="7"/><circle cx="290" cy="288" r="16" fill="var(--primary)"/><path d="M120 85 V160 M82 123 H157 M420 230 V300 M385 265 H457" stroke="var(--primary)" stroke-width="16" stroke-linecap="round"/>{% endif %}</svg></div>{% endmacro %}
{% macro media(d,role) %}{% if d['media'].get(role) %}<img class="real-media" src="{{ d['media'][role] }}" alt="{{ d['page']|replace('_',' ') }} {{ role }}" data-class="image" data-semantic="{{ role }}_photo">{% else %}{{ art(d['page'],role~'_illustration') }}{% endif %}{% endmacro %}
