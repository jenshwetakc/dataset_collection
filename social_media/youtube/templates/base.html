<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="
            width=device-width,
            initial-scale=1.0,
            maximum-scale=1.0,
            user-scalable=no
        "
    >

    <title>
        {% block title %}
        YouTube Synthetic UI
        {% endblock %}
    </title>


    <!-- =====================================================
         Google Material Symbols
         ===================================================== -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block"
        rel="stylesheet"
    >


    <!-- =====================================================
         Base Style
         ===================================================== -->

    <style>

        /* ==================================================
           Box Sizing
           ================================================== */

        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }


        /* ==================================================
           Root
           ================================================== */

        html {
            width: 100%;
            height: 100%;

            margin: 0;
            padding: 0;

            background:
                {{ theme.background }};

            color:
                {{ theme.on_background }};

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            -webkit-text-size-adjust: 100%;
        }


        body {
            width: 100%;
            min-height: 100%;

            margin: 0;
            padding: 0;

            overflow-x: hidden;

            background:
                {{ theme.background }};

            color:
                {{ theme.on_background }};

            user-select: none;
        }


        /* ==================================================
           Generic Element Reset
           ================================================== */

        button,
        input,
        textarea,
        select {
            font: inherit;
        }


        button {
            margin: 0;
            padding: 0;

            border: none;

            background: transparent;

            cursor: default;

            -webkit-tap-highlight-color:
                transparent;
        }


        input {
            min-width: 0;
        }


        input,
        textarea {
            user-select: text;
        }


        img,
        video {
            display: block;

            max-width: 100%;
        }


        video {
            background: #000;
        }


        svg,
        canvas {
            max-width: 100%;
        }


        a {
            color: inherit;

            text-decoration: none;
        }


        h1,
        h2,
        h3,
        h4,
        h5,
        h6,
        p {
            margin: 0;
        }


        /* ==================================================
           Material Symbols
           ================================================== */

        .material-symbols-rounded {
            font-family:
                "Material Symbols Rounded";

            font-weight:
                normal;

            font-style:
                normal;

            font-size:
                24px;

            line-height:
                1;

            letter-spacing:
                normal;

            text-transform:
                none;

            display:
                inline-block;

            white-space:
                nowrap;

            word-wrap:
                normal;

            direction:
                ltr;

            font-feature-settings:
                "liga";

            -webkit-font-feature-settings:
                "liga";

            -webkit-font-smoothing:
                antialiased;

            user-select:
                none;

            vertical-align:
                middle;

            font-variation-settings:
                "FILL" 0,
                "wght" 400,
                "GRAD" 0,
                "opsz" 24;
        }


        /* ==================================================
           Scrollbar
           ================================================== */

        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }


        ::-webkit-scrollbar-track {
            background:
                transparent;
        }


        ::-webkit-scrollbar-thumb {
            background:
                {{ theme.border }};

            border-radius:
                10px;
        }


        ::-webkit-scrollbar-thumb:hover {
            background:
                {{ theme.icon_secondary }};
        }


        /* ==================================================
           Accessibility / Rendering Helpers
           ================================================== */

        [hidden] {
            display: none !important;
        }


        .visually-hidden {
            position:
                absolute !important;

            width:
                1px !important;

            height:
                1px !important;

            padding:
                0 !important;

            margin:
                -1px !important;

            overflow:
                hidden !important;

            clip:
                rect(
                    0,
                    0,
                    0,
                    0
                ) !important;

            white-space:
                nowrap !important;

            border:
                0 !important;
        }


        /* ==================================================
           Page Root
           ================================================== */

        #app {
            width: 100%;

            min-height: 100vh;
        }

    </style>


    {% block head %}
    {% endblock %}

</head>


<body>

    <div id="app">

        {% block content %}
        {% endblock %}

    </div>

</body>

</html>
